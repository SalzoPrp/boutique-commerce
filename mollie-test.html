<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Mollie | CORVIANE</title>
<style>
body{max-width:40rem;margin:3rem auto;padding:0 1rem;font:1rem/1.6 system-ui;color:#202020}
button{font:inherit;font-weight:700;border:0;padding:.65rem 1rem;border-radius:.5rem;background:#111;color:#f4c466;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<main>
<h1>Test Mollie CORVIANE</h1>
<p>Calcule la livraison AW et simule le paiement du panier. Aucun débit réel.</p>
<p><a href="/catalogue-aw/boutique.html">Ouvrir le catalogue de test</a></p>
<label for="country">Pays de livraison</label>
<select id="country">
<option value="BE">Belgique</option>
<option value="FR">France</option>
<option value="DE">Allemagne</option>
<option value="LU">Luxembourg</option>
<option value="NL">Pays-Bas</option>
</select>
<button id="start" type="button">Calculer le total</button>
<p id="quote" aria-live="polite"></p>
<button id="pay" type="button" hidden>Tester le paiement</button>
<button id="refresh" type="button" hidden>Vérifier le statut</button>
<p id="status" role="status"></p>
</main>
<script type="module">
const start = document.querySelector('#start');
const country = document.querySelector('#country');
const quoteText = document.querySelector('#quote');
const pay = document.querySelector('#pay');
const euros = new Intl.NumberFormat('fr-BE', { style: 'currency', currency: 'EUR' });
const money = cents => euros.format(cents / 100);
const refresh = document.querySelector('#refresh');
const status = document.querySelector('#status');
const pendingKey = 'corviane_mollie_test_payment';

async function request(options, query = '') {
  const response = await fetch('/api/mollie-test' + query, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Connexion de test indisponible.');
  return data;
}

let draft;
function clearQuote() {
  draft = undefined;
  quoteText.textContent = '';
  pay.hidden = true;
}
country.onchange = clearQuote;

function submit(payload) {
  return request({
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
}

start.onclick = async () => {
  clearQuote();
  status.textContent = '';
  start.disabled = true;
  country.disabled = true;
  try {
    const raw = localStorage.getItem('corviane_aw_test_basket');
    const basket = JSON.parse(raw || '[]');
    if (!Array.isArray(basket) || !basket.length) {
      throw new Error('Ajoute un article dans le catalogue de test, puis reviens sur cette page.');
    }
    const payload = { basket, country: country.value };
    const { quote } = await submit(payload);
    draft = { raw, payload, expectedTotal: quote.total, attempt: crypto.randomUUID() };
    const surcharge = quote.surcharge ? ' · Supplément AW ' + money(quote.surcharge) : '';
    quoteText.textContent = quote.grams + ' g · Articles ' + money(quote.subtotal) +
      ' · Livraison ' + money(quote.shipping) + surcharge + ' · Total ' + money(quote.total);
    pay.hidden = false;
  } catch (error) {
    status.textContent = error.message;
  } finally {
    start.disabled = false;
    country.disabled = false;
  }
};

pay.onclick = async () => {
  if (!draft || draft.raw !== localStorage.getItem('corviane_aw_test_basket')) {
    clearQuote();
    status.textContent = 'Le panier a changé. Recalcule le total.';
    return;
  }
  pay.disabled = true;
  start.disabled = true;
  country.disabled = true;
  try {
    status.textContent = 'Ouverture de Mollie en mode test…';
    const result = await submit({ ...draft.payload, attempt: draft.attempt, expectedTotal: draft.expectedTotal });
    sessionStorage.setItem(pendingKey, result.id);
    location.assign(result.checkout);
  } catch (error) {
    status.textContent = error.message;
  } finally {
    pay.disabled = false;
    start.disabled = false;
    country.disabled = false;
  }
};

const messages = {
  paid: 'Paiement de test confirmé.',
  open: 'Paiement de test en attente.',
  pending: 'Paiement de test en attente.',
  authorized: 'Paiement de test autorisé. Confirmation en attente.',
  failed: 'Le paiement de test a échoué.',
  canceled: 'Le paiement de test a été annulé.',
  expired: 'Le paiement de test a expiré.'
};
async function showStatus() {
  refresh.disabled = true;
  try {
    const id = sessionStorage.getItem(pendingKey);
    if (!id) {
      status.textContent = 'Aucun paiement de test retrouvé dans cet onglet.';
      return;
    }
    const result = await request(undefined, '?id=' + encodeURIComponent(id));
    status.textContent = messages[result.status];
  } catch (error) {
    status.textContent = error.message;
  } finally {
    refresh.disabled = false;
  }
}
if (new URLSearchParams(location.search).has('retour')) {
  start.hidden = true;
  country.hidden = true;
  document.querySelector('label[for="country"]').hidden = true;
  refresh.hidden = false;
  refresh.onclick = showStatus;
  showStatus();
}
</script>
</body>
</html>
