<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORVIANE — Catalogue</title>
<style>
:root{--black:#080808;--gold:#efb544;--ink:#181818;--gray:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Arial,sans-serif}
header{background:var(--black);color:white;text-align:center;padding:2.25rem 1rem 2rem}
.brand{font:clamp(2.5rem,8vw,5.25rem)/1 Georgia,serif;letter-spacing:.08em;color:#f4c466}
.offer{margin:0;text-align:center;background:var(--gold);color:var(--black);padding:.8rem 1rem;font-weight:700}
.offer strong{font-size:1.3em}
main{max-width:1330px;margin:auto;padding:2.75rem clamp(1rem,4vw,3rem) 4rem}
h1{display:flex;align-items:center;justify-content:center;gap:1rem;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:0 0 1.65rem}
h1::before,h1::after{content:"";width:clamp(1.7rem,8vw,5rem);height:2px;background:var(--gold)}
.filters{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.filters button{font:inherit;background:white;color:var(--ink);border:1px solid #d7d7d7;border-radius:.3rem;padding:.46rem .85rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--black);color:white;border-color:var(--black)}
button:focus-visible{outline:3px solid #a36a00;outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1.15rem}
article{min-width:0;border:1px solid #e6e6e6;border-radius:.45rem;overflow:hidden;background:white}
.photo{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--gray)}
.card-text{padding:1.05rem}
.category{margin:0;color:#665024;font-size:.8rem}
h2{font-size:1rem;line-height:1.35;margin:.35rem 0 .8rem}
.price{margin:0;font-size:1.22rem;font-weight:700}
.price small{font-size:.7rem;font-weight:400;color:#4d4d4d}
.tools{display:flex;gap:.7rem;align-items:end;flex-wrap:wrap}
.tools label{display:grid;gap:.3rem;font-size:.85rem}
.tools label:first-child{flex:1 1 15rem}
.tools label:not(:first-child){flex:1 1 9rem}
input,select,main button{font:inherit;padding:.5rem .7rem;border:1px solid #d7d7d7;border-radius:.3rem}
input,select{width:100%;min-width:0;background:white;color:var(--ink)}
.card-text details{font-size:.85rem;margin:.65rem 0}
details img{width:100%;object-fit:contain;aspect-ratio:1}
.card-text button,#next,#items button{background:var(--gold);border-color:var(--gold);color:var(--black);cursor:pointer}
.card-text button:disabled{background:#eee;border-color:#ddd;cursor:default}
#next,#basket{margin-top:1.25rem}
#basket{background:var(--gray);padding:1rem;border-radius:.45rem}
#items button{margin-inline-start:.55rem}
.catalogue-nav{background:var(--black);gap:0;padding:.3rem .5rem;border-bottom:1px solid var(--gold)}
.catalogue-nav button,.catalogue-nav summary{color:#fff;background:transparent;border:0;border-radius:0;cursor:pointer;padding:.65rem .75rem}
.catalogue-nav button:hover,.catalogue-nav button[aria-pressed="true"],.catalogue-nav summary:hover,.catalogue-nav details[open] summary,.catalogue-nav summary[data-active="true"]{color:var(--gold)}
.catalogue-nav details{position:relative}
.catalogue-nav summary{list-style:none}
.catalogue-nav summary::-webkit-details-marker{display:none}
.catalogue-nav summary::after{content:" ▾";color:var(--gold)}
.category-panel{position:absolute;z-index:2;inset-inline-end:0;min-width:min(17rem,calc(100vw - 3rem));background:white;box-shadow:0 4px 14px #0003}
.catalogue-nav .category-panel button{display:block;width:100%;text-align:start;color:var(--ink)}
.catalogue-nav .category-panel button:hover,.catalogue-nav .category-panel button[aria-pressed="true"]{background:#fff2d7;color:var(--ink)}
@media(max-width:40rem){
 .catalogue-nav details[open]{flex:0 0 100%;min-width:0}
 .catalogue-nav .category-panel{position:static;min-width:0}
}
.home-link{display:inline-block;margin-bottom:.8rem;color:#f4c466;font-weight:700;text-decoration:underline;text-underline-offset:.2em}\n</style>
</head>

</nav>
<div class="tools">
<label><span data-t="search">Rechercher</span><input id="search" type="search"></label>

</div>
<p id="status" role="status"></p>
<div class="grid" id="products"></div>
<button id="next" type="button" hidden data-t="more">Afficher plus</button>
<section id="basket"><h2 data-t="basket">Panier</h2><ul id="items"></ul><p id="total" aria-live="polite"></p><p><a id="checkout-link" href="../checkout-aw.html" hidden></a></p>
<p id="basket-error" role="status" hidden></p>
</section>
<p><a id="shop-link" href="../index.html"></a></p>
</main>

function saveBasket() {
  try {
    localStorage.setItem(basketKey, JSON.stringify(
      [...basket.values()].map(({ product, quantity }) => [product.sku, quantity])
    ));
  } catch {
    return false;
  }
  return true;
}

function restoreBasket() {
  basket.clear();
  try {
    const saved = JSON.parse(localStorage.getItem(basketKey) || '[]');
    const bySku = new Map(products.map(product => [product.sku, product]));
    for (const [sku, quantity] of saved) {
      const product = bySku.get(sku);
      if (product?.active && product.stock > 0 && Number.isSafeInteger(quantity) && quantity > 0) {
        basket.set(sku, { product, quantity: Math.min(quantity, product.stock, 99) });
      }
    }
  } catch { /* An invalid or unavailable saved basket can be ignored. */ }
}
let products = [];
let clothingGroup = '';
const pageSize = 24;
let limit = pageSize;
let failed = false;
const lang = () => find('language').value;
const t = key => labels[lang()][keys.indexOf(key)];
const euro = cents => new Intl.NumberFormat(lang(), { style: 'currency', currency: 'EUR' }).format(cents / 100);

function node(tag, content) {
  const item = document.createElement(tag);
  if (content !== undefined) item.textContent = content;
  return item;
}

function renderBasket() {
  const lines = [...basket.values()];
  find('items').replaceChildren(...lines.map(({ product, quantity }) => {
    const line = node('li', `${quantity} × ${product.name}`);
    const remove = node('button', t('remove'));
    remove.onclick = () => {
      if (quantity === 1) basket.delete(product.sku);
      else basket.get(product.sku).quantity--;
      saveBasket();
      render();
    };
    line.append(remove);
    return line;
  }));
  find('checkout-link').hidden = !lines.length;
  const amount = belgianQuote(lines);
  find('total').textContent = amount.shipping === null
    ? `${t('subtotal')} ${euro(amount.subtotal)} · ${t('quote')}`
    : `${t('subtotal')} ${euro(amount.subtotal)} · ${t('shipping')} ${euro(amount.shipping)}` +
      (amount.surcharge ? ` · ${t('surcharge')} ${euro(amount.surcharge)}` : '') +
      ` · ${t('total')} ${euro(amount.total)}`;
}

function render() {
  const query = find('search').value.trim().toLowerCase();
  const category = find('category').value;
  const shown = products.filter(product =>
    (!category || product.category === category) &&
    (category !== 'Clothing' || !clothingGroup || clothingGroups[product.sku] === clothingGroup) &&
    `${product.name} ${product.sku}`.toLowerCase().includes(query));
  if (category === 'Fragrance') {
    const rank = product => /\breed diffuser\b/i.test(product.name) ? 0
      : /\b(?:fragrance|essential) oils?\b/i.test(product.name) ? 2 : 1;
    shown.sort((left, right) => rank(left) - rank(right));
  }
  find('status').textContent = failed ? t('error') : `${shown.length} ${t('subtotal').toLowerCase()}`;
  find('next').hidden = shown.length <= limit;
  find('products').replaceChildren(...shown.slice(0, limit).map(product => {
    const card = node('article');
     card.dataset.category = product.category;
    if (product.photos.length) {
      const photo = node('img');
      photo.className = 'photo';
       const sources = [featured.get(product.sku), ...product.photos].filter(Boolean);
       let index = 0;
       photo.addEventListener('error', () => {
         index++;
         if (index < sources.length) photo.src = sources[index];
       });
       photo.src = sources[index];
      photo.loading = 'lazy';
      photo.alt = product.name;
      card.append(photo);
    }
    const details = node('details');
    details.lang = 'en';
    details.append(node('summary', product.name), node('p', product.description));
    details.addEventListener('toggle', () => {
      if (!details.open || details.dataset.gallery) return;
      details.dataset.gallery = 'ready';
      for (const url of product.photos.slice(1)) {
        const image = node('img');
        image.src = url;
        image.alt = product.name;
        image.loading = 'lazy';
        details.append(image);
      }
    });
    const add = node('button', product.active && product.stock > 0 ? t('add') : t('unavailable'));
    const quantity = basket.get(product.sku)?.quantity ?? 0;
    add.disabled = !product.active || quantity >= Math.min(product.stock, 99);
    add.onclick = () => {
      const current = basket.get(product.sku)?.quantity ?? 0;
      if (current >= Math.min(product.stock, 99)) return;
      basket.set(product.sku, { product, quantity: current + 1 });
      add.disabled = current + 1 >= Math.min(product.stock, 99);
      saveBasket();
      renderBasket();
    };
    const content = node('div');
    content.className = 'card-text';
    const caption = node('p', (lang() === 'fr' ? featuredLabels.get(product.category) : undefined) ?? categoryNames[product.category]?.[['fr','nl'].indexOf(lang())] ?? product.category);
    caption.className = 'category';
    const name = node('h2', product.name);
    name.lang = 'en';
    const price = node('p', euro(product.cents));
    price.className = 'price';
    price.append(' ', node('small', lang() === 'en' ? 'incl. VAT' : lang() === 'nl' ? 'incl. btw' : 'TVAC'));
    content.append(caption, name, price, node('p', product.sku), details, add);
    if (product.units > 1) price.append(' ', node('small', '× ' + product.units));
    card.append(content);
    return card;
  }));
  renderBasket();
}

function localize() {
  document.documentElement.lang = lang();
  find('home-link').textContent = {fr:'← Accueil',nl:'← Startpagina',en:'← Home'}[lang()];
  find('checkout-link').textContent = {
    fr: 'Passer ma commande', nl: 'Naar afrekenen', en: 'Proceed to checkout'
  }[lang()];
  find('shop-link').textContent = {
    fr: 'Retour à la boutique', nl: 'Terug naar de winkel', en: 'Back to the shop'
  }[lang()];
  document.querySelectorAll('[data-t]').forEach(element => {
    element.textContent = t(element.dataset.t);
  });
  for (const option of find('category').options) {
    option.textContent = option.value
      ? categoryNames[option.value]?.[['fr', 'nl'].indexOf(lang())] ?? option.value
      : t('all');
  }
  find('offer').innerHTML = (lang() === 'fr' ? 'Livraison offerte en Belgique dès 99 € TVAC' : t('offer')).replace(/99\s*€\s*TVAC|€99\s+incl\. VAT|€\s*99\s+incl\. btw\./, '<strong>$&</strong>');
  for (const button of categoryButtons) {
    const category = button.dataset.filter;
    button.textContent = lang() === 'fr' ? featuredLabels.get(category) : category
      ? categoryNames[category]?.[['fr','nl'].indexOf(lang())] ?? category
      : ({fr: 'Tout voir', nl: 'Alles bekijken', en: 'View all'})[lang()];
  }
  find('clothing-toggle').textContent = categoryNames.Clothing[['fr','nl'].indexOf(lang())] ?? 'Clothing';
  for (const button of clothingButtons) {
    const group = button.dataset.group;
    button.textContent = group
      ? clothingNames[group][['fr','nl'].indexOf(lang())] ?? group
      : ({fr:'Tout voir', nl:'Alles bekijken', en:'View all'})[lang()];
  }
  syncFilters();
  render();
}

const categoryButtons = document.querySelectorAll('[data-filter]');
const featuredLabels = new Map(Array.from(categoryButtons, button => [button.dataset.filter, button.textContent]));
const clothingButtons = document.querySelectorAll('[data-group]');
const clothingMenu = find('clothing-menu');
function readCategoryLink() {
  const params = new URL(location.href).searchParams;
  const category = params.get('categorie') || '';
  const options = [...find('category').options];
  find('category').value = options.some(option => option.value === category) ? category : '';
  const group = params.get('sous-categorie') || '';
  clothingGroup = category === 'Clothing' &&
    [...clothingButtons].some(button => button.dataset.group === group) ? group : '';
}

function saveCategoryLink() {
  const url = new URL(location.href);
  const category = find('category').value;
  if (category) url.searchParams.set('categorie', category);
  else url.searchParams.delete('categorie');
  if (category === 'Clothing' && clothingGroup) url.searchParams.set('sous-categorie', clothingGroup);
  else url.searchParams.delete('sous-categorie');
  if (url.href !== location.href) history.pushState(null, '', url);
}

function syncFilters() {
  const clothingSelected = find('category').value === 'Clothing';
  find('clothing-toggle').dataset.active = String(clothingSelected);
  for (const button of clothingButtons) {
    button.setAttribute('aria-pressed', String(clothingSelected && button.dataset.group === clothingGroup));
  }
  for (const button of categoryButtons) {
    button.setAttribute('aria-pressed', String(button.dataset.filter === find('category').value));
  }
}
for (const button of categoryButtons) {
  button.onclick = () => {
    find('category').value = button.dataset.filter;
    clothingGroup = '';
    saveCategoryLink();
    clothingMenu.open = false;
    syncFilters();
    limit = pageSize;
    render();
  };
}
for (const button of clothingButtons) {
  button.onclick = () => {
    find('category').value = 'Clothing';
    clothingGroup = button.dataset.group;
    saveCategoryLink();
    clothingMenu.open = false;
    find('clothing-toggle').focus();
    limit = pageSize;
    syncFilters();
    render();
  };
}
clothingMenu.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || !clothingMenu.open) return;
  clothingMenu.open = false;
  find('clothing-toggle').focus();
});
find('category').append(new Option(t('all'), ''));
find('language').onchange = localize;
for (const id of ['search', 'category']) find(id).oninput = () => { limit = pageSize; syncFilters(); render(); };
find('checkout-link').onclick = event => {
  if (saveBasket()) return;
  event.preventDefault();
  const error = find('basket-error');
  error.textContent = {
    fr: 'Le navigateur bloque la sauvegarde du panier.',
    nl: 'De browser blokkeert het opslaan van de winkelmand.',
    en: 'Your browser blocks saving the basket.'
  }[lang()];
  error.hidden = false;
};
find('next').onclick = () => { limit += pageSize; render(); };
try {
  const response = await fetch('./produits.json');
  if (!response.ok) throw new Error('Catalogue indisponible');
  products = await response.json();
  const productBySku = new Map(products.map(product => [product.sku, product]));
  products = [...Array.from(featured.keys(), sku => productBySku.get(sku)).filter(Boolean),
    ...products.filter(product => !featured.has(product.sku))];
  restoreBasket();
  const categories = [...new Set(products.map(product => product.category))].sort();
  categories.forEach(category => find('category').append(new Option(category, category)));
  readCategoryLink();
} catch {
  failed = true;
}
localize();
window.addEventListener('popstate', () => {
  readCategoryLink();
  limit = pageSize;
  syncFilters();
  render();
});
window.addEventListener('pageshow', event => {
  if (event.persisted && !failed) {
    restoreBasket();
    render();
  }
});
</script>
